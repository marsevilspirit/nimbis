# Enables unstable formatting features that are not yet finalized
unstable_features = true

# Automatically reorder and sort imports into three groups
group_imports = "StdExternalCrate"

# Merge imports from the same module
imports_granularity = "Item"

# Force Unix-style newlines
newline_style = "Unix"

# Reorder imports alphabetically (forces alphabetical sorting of imports)
reorder_imports = true

# Use hard tabs instead of spaces for indentation
hard_tabs = true

# Keep manually wrapped comments stable across nightly rustfmt changes
wrap_comments = false

# (Optional) Whether to convert /* */ to //
normalize_comments = true

# Sets the maximum line width for code formatting
max_width = 100
