name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Always enable colored output in Cargo (for better readability in CI logs)
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: llvm-tools-preview

    - name: Cache Rust Dependencies
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ runner.os }}-rust-check
        cache-on-failure: true

    - name: Install just
      uses: taiki-e/install-action@just

    - name: Check
      run: just check

    - name: Install cargo-shear
      uses: taiki-e/install-action@cargo-shear

    - name: Run cargo-shear
      run: cargo shear

  unit_test:
    name: Unit Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: llvm-tools-preview

    - name: Cache Rust Dependencies
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ runner.os }}-rust-unit-test
        cache-on-failure: true

    - name: Install just
      uses: taiki-e/install-action@just

    - name: Install nextest
      uses: taiki-e/install-action@nextest

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Run Unit Test
      run: just test

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./codecov.json
        flags: rust
        name: rust-coverage
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  build_release:
    name: Build Release
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: llvm-tools-preview

    - name: Cache Rust Dependencies
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ runner.os }}-rust-build-release-e2e
        cache-on-failure: true

    - name: Install just
      uses: taiki-e/install-action@just

    - name: Build Release
      run: just build --release

    - name: Upload Unix Release Binary
      if: runner.os != 'Windows'
      uses: actions/upload-artifact@v7
      with:
        name: nimbis-release-${{ matrix.os }}
        path: |
          target/release/nimbis
          target/release/xtask
        if-no-files-found: error
        overwrite: true

    - name: Upload Windows Release Binary
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v7
      with:
        name: nimbis-release-${{ matrix.os }}
        path: target/release/nimbis.exe
        if-no-files-found: error
        overwrite: true

  build_main_release:
    name: Build Main Release
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: llvm-tools-preview

    - name: Cache Rust Dependencies
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ubuntu-latest-rust-build-main-release
        cache-on-failure: true

    - name: Install just
      uses: taiki-e/install-action@just

    - name: Build Release
      run: just build --release

    - name: Upload Main Release Binary
      uses: actions/upload-artifact@v7
      with:
        name: nimbis-release-main-ubuntu-latest
        path: target/release/nimbis
        if-no-files-found: error
        overwrite: true

  build_redis_benchmark:
    name: Build Redis 8.0.0 Benchmark Client
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Redis 8.0.0
      uses: actions/checkout@v7
      with:
        repository: redis/redis
        ref: e91a340e241cf0abe3c6a0c254214fbe4aa1d95f
        path: redis

    - name: Build Redis benchmark clients
      run: |
        make -C redis -j2 redis-benchmark
        make -C redis -j2 redis-cli

    - name: Verify deterministic seed support
      run: redis/src/redis-benchmark --help | grep -F -- "--seed"

    - name: Upload Redis 8.0.0 benchmark client
      uses: actions/upload-artifact@v7
      with:
        name: redis-benchmark-8.0.0
        path: |
          redis/src/redis-benchmark
          redis/src/redis-cli
        if-no-files-found: error
        overwrite: true

  e2e_local:
    name: E2E Test (Local Filesystem)
    needs: build_release
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - name: Install just
      uses: taiki-e/install-action@just

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'
        cache: true
        cache-dependency-path: e2e-test/go.sum

    - name: Download Release Binary
      uses: actions/download-artifact@v8
      with:
        name: nimbis-release-${{ matrix.os }}
        path: target/release

    - name: Make Release Binary Executable
      if: runner.os != 'Windows'
      run: chmod +x target/release/nimbis

    - name: Run E2E Test
      run: just e2e-test

  e2e_minio:
    name: E2E Test (MinIO)
    needs: build_release
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install just
      uses: taiki-e/install-action@just

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'
        cache: true
        cache-dependency-path: e2e-test/go.sum

    - name: Download Release Binary
      uses: actions/download-artifact@v8
      with:
        name: nimbis-release-ubuntu-latest
        path: target/release

    - name: Make Release Binary Executable
      run: chmod +x target/release/nimbis

    - name: Start MinIO
      run: |
        docker run -d \
          --name nimbis-minio \
          -p 9000:9000 \
          -e MINIO_ROOT_USER=minioadmin \
          -e MINIO_ROOT_PASSWORD=minioadmin \
          quay.io/minio/minio server /data --address :9000
        for i in {1..30}; do
          if curl -fsS http://127.0.0.1:9000/minio/health/ready; then
            exit 0
          fi
          sleep 1
        done
        docker logs nimbis-minio
        exit 1

    - name: Create MinIO bucket
      run: |
        docker run --rm --network host \
          -e MC_HOST_local=http://minioadmin:minioadmin@127.0.0.1:9000 \
          quay.io/minio/mc mb --ignore-existing local/nimbis

    - name: Run E2E Test Against MinIO
      env:
        NIMBIS_OBJECT_STORE_URL: s3://nimbis/nimbis-ci-${{ github.run_id }}
        NIMBIS_OBJECT_STORE_OPTION_AWS_REGION: us-east-1
        NIMBIS_OBJECT_STORE_OPTION_AWS_ENDPOINT: http://127.0.0.1:9000
        NIMBIS_OBJECT_STORE_OPTION_AWS_ACCESS_KEY_ID: minioadmin
        NIMBIS_OBJECT_STORE_OPTION_AWS_SECRET_ACCESS_KEY: minioadmin
        NIMBIS_OBJECT_STORE_OPTION_AWS_VIRTUAL_HOSTED_STYLE_REQUEST: "false"
        NIMBIS_OBJECT_STORE_OPTION_AWS_ALLOW_HTTP: "true"
      run: just e2e-test

  benchmark:
    name: Benchmark (${{ matrix.shard.name }}, ${{ matrix.data_size }} bytes, replica ${{ matrix.replica }})
    if: ${{ github.event_name == 'pull_request' }}
    needs: [build_release, build_main_release, build_redis_benchmark]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: string
            commands: "get,set"
          - name: hash
            commands: "hget,hset"
          - name: list
            commands: "lpush,lpop"
          - name: set
            commands: "sadd,srem"
          - name: zset
            commands: "zadd,zrem"
        data_size: [512, 1024]
        replica: [1, 2, 3]

    steps:
    - name: Download Main release binary
      uses: actions/download-artifact@v8
      with:
        name: nimbis-release-main-ubuntu-latest
        path: artifacts/main

    - name: Download PR release binaries
      uses: actions/download-artifact@v8
      with:
        name: nimbis-release-ubuntu-latest
        path: artifacts/pr

    - name: Download Redis 8.0.0 benchmark client
      uses: actions/download-artifact@v8
      with:
        name: redis-benchmark-8.0.0
        path: artifacts/redis

    - name: Make benchmark binaries executable
      run: |
        chmod +x artifacts/main/nimbis
        chmod +x artifacts/pr/nimbis
        chmod +x artifacts/pr/xtask
        chmod +x artifacts/redis/redis-benchmark
        chmod +x artifacts/redis/redis-cli

    - name: Run paired benchmark shard
      env:
        BENCHMARK_OUTPUT_DIR: benchmark-output/${{ matrix.shard.name }}-${{ matrix.data_size }}-replica-${{ matrix.replica }}
      run: |
        mkdir -p "$BENCHMARK_OUTPUT_DIR"
        {
          echo "github_run_id=${{ github.run_id }}"
          echo "github_run_attempt=${{ github.run_attempt }}"
          echo "runner_name=$RUNNER_NAME"
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          echo "main_label=${{ github.event.pull_request.base.sha }}"
          echo "pr_label=${{ github.sha }}"
          echo "pr_head_sha=${{ github.event.pull_request.head.sha }}"
          echo
          echo "== uname =="
          uname -a
          echo
          echo "== lscpu =="
          lscpu
          echo
          echo "== sha256 =="
          sha256sum \
            "$GITHUB_WORKSPACE/artifacts/main/nimbis" \
            "$GITHUB_WORKSPACE/artifacts/pr/nimbis" \
            "$GITHUB_WORKSPACE/artifacts/pr/xtask" \
            "$GITHUB_WORKSPACE/artifacts/redis/redis-benchmark" \
            "$GITHUB_WORKSPACE/artifacts/redis/redis-cli"
          echo
          echo "== tool versions =="
          "$GITHUB_WORKSPACE/artifacts/pr/xtask" --version
          "$GITHUB_WORKSPACE/artifacts/redis/redis-benchmark" --version
          "$GITHUB_WORKSPACE/artifacts/redis/redis-cli" --version
        } > "$BENCHMARK_OUTPUT_DIR/environment.txt"
        "$GITHUB_WORKSPACE/artifacts/pr/xtask" benchmark-ci-shard \
          --main-binary "$GITHUB_WORKSPACE/artifacts/main/nimbis" \
          --pr-binary "$GITHUB_WORKSPACE/artifacts/pr/nimbis" \
          --commands "${{ matrix.shard.commands }}" \
          --data-size ${{ matrix.data_size }} \
          --replica ${{ matrix.replica }} \
          --run-attempt ${{ github.run_attempt }} \
          --main-label '${{ github.event.pull_request.base.sha }}' \
          --pr-label '${{ github.sha }}' \
          --requests 200000 \
          --clients 100 \
          --random-keyspace 2147483647 \
          --pipeline-depth 50 \
          --redis-benchmark "$GITHUB_WORKSPACE/artifacts/redis/redis-benchmark" \
          --redis-cli "$GITHUB_WORKSPACE/artifacts/redis/redis-cli" \
          --output-dir "$GITHUB_WORKSPACE/$BENCHMARK_OUTPUT_DIR"

    - name: Upload raw benchmark shard
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-shard-${{ matrix.shard.name }}-${{ matrix.data_size }}-replica-${{ matrix.replica }}-attempt-${{ github.run_attempt }}
        path: benchmark-output/${{ matrix.shard.name }}-${{ matrix.data_size }}-replica-${{ matrix.replica }}
        if-no-files-found: error
        retention-days: 30

  benchmark_context:
    name: Cross-database benchmark context (${{ matrix.data_size }} bytes)
    if: ${{ github.event_name == 'pull_request' }}
    needs: [build_release, build_main_release, build_redis_benchmark]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        data_size: [512, 1024]
    env:
      REDIS_VERSION: "8.0.0"
      PIKIWIDB_VERSION: "v3.5.7-alpha"
      KVROCKS_VERSION: "2.16.0"

    steps:
    - name: Download Main release binary
      uses: actions/download-artifact@v8
      with:
        name: nimbis-release-main-ubuntu-latest
        path: artifacts/main

    - name: Download PR release binaries
      uses: actions/download-artifact@v8
      with:
        name: nimbis-release-ubuntu-latest
        path: artifacts/pr

    - name: Download Redis 8.0.0 benchmark client
      uses: actions/download-artifact@v8
      with:
        name: redis-benchmark-8.0.0
        path: artifacts/redis

    - name: Make benchmark binaries executable
      run: |
        chmod +x artifacts/main/nimbis
        chmod +x artifacts/pr/nimbis
        chmod +x artifacts/pr/xtask
        chmod +x artifacts/redis/redis-benchmark
        chmod +x artifacts/redis/redis-cli

    - name: Generate cross-database context
      run: |
        set -o pipefail
        context_root="$GITHUB_WORKSPACE/benchmark-context"
        context_runtime="$RUNNER_TEMP/nimbis-context-${{ matrix.data_size }}"
        context_xtask="$GITHUB_WORKSPACE/artifacts/pr/xtask"
        context_benchmark="$GITHUB_WORKSPACE/artifacts/redis/redis-benchmark"
        context_cli="$GITHUB_WORKSPACE/artifacts/redis/redis-cli"
        context_pid=""
        context_container=""
        mkdir -p "$context_root" "$context_runtime"

        cleanup_server() {
          if [[ -n "$context_pid" ]]; then
            kill "$context_pid" >/dev/null 2>&1 || true
            wait "$context_pid" >/dev/null 2>&1 || true
            context_pid=""
          fi
          if [[ -n "$context_container" ]]; then
            docker rm -f "$context_container" >/dev/null 2>&1 || true
            context_container=""
          fi
        }
        trap cleanup_server EXIT

        wait_until_ready() {
          for _ in {1..60}; do
            if "$context_cli" -h 127.0.0.1 -p 6379 --raw PING 2>/dev/null | grep -qx PONG; then
              return 0
            fi
            if [[ -n "$context_pid" ]] && ! kill -0 "$context_pid" 2>/dev/null; then
              break
            fi
            if [[ -n "$context_container" ]] &&
              ! docker inspect --format '{{.State.Running}}' "$context_container" 2>/dev/null | grep -qx true; then
              break
            fi
            sleep 1
          done
          if [[ -n "$context_container" ]]; then
            docker logs "$context_container" || true
          fi
          return 1
        }

        start_nimbis() {
          local slug="$1"
          local binary="$2"
          local runtime="$context_runtime/$slug"
          cleanup_server
          mkdir -p "$runtime"
          (
            cd "$runtime"
            exec env \
              NIMBIS_OBJECT_STORE_URL=file:nimbis_store \
              NIMBIS_TRACE_ENABLED=false \
              "$binary" \
              --host 127.0.0.1 \
              --port 6379 \
              --log-level error,nimbis::server=info
          ) > "$context_root/$slug.log" 2>&1 &
          context_pid=$!
          wait_until_ready
        }

        start_container() {
          local slug="$1"
          local image="$2"
          local container_port="$3"
          shift 3
          cleanup_server
          context_container="nimbis-context-${{ github.run_id }}-${{ matrix.data_size }}-$slug"
          docker run -d \
            --name "$context_container" \
            -p "6379:$container_port" \
            "$image" "$@"
          wait_until_ready
        }

        benchmark_server() {
          local slug="$1"
          for pipeline in 1 50; do
            local output="$context_root/$slug-p$pipeline.txt"
            : > "$output"
            for command in get set hget hset lpush lpop sadd srem zadd zrem; do
              "$context_xtask" redis-benchmark \
                --profile comparison \
                --command "$command" \
                --n 200000 \
                --c 100 \
                --d ${{ matrix.data_size }} \
                --p "$pipeline" \
                --r 2147483647 \
                --seed-n 200000 \
                --seed 279000 \
                --settle-millis 1000 \
                --redis-benchmark "$context_benchmark" \
                --redis-cli "$context_cli" \
                --output-dir "$context_root/raw/$slug-p$pipeline-$command" \
                >> "$output"
            done
          done
          sed -E 's/, p50=[^,]+ msec//' \
            "$context_root/$slug-p50.txt" \
            > "$context_root/$slug-p50-report.txt"
        }

        start_nimbis \
          nimbis-main \
          "$GITHUB_WORKSPACE/artifacts/main/nimbis"
        benchmark_server main

        start_nimbis \
          nimbis-feature \
          "$GITHUB_WORKSPACE/artifacts/pr/nimbis"
        benchmark_server feature

        start_container redis "redis:$REDIS_VERSION" 6379
        benchmark_server redis

        start_container pikiwidb "pikadb/pika:$PIKIWIDB_VERSION" 9221
        benchmark_server pikiwidb

        start_container \
          kvrocks \
          "apache/kvrocks:$KVROCKS_VERSION" \
          6666 \
          --bind 0.0.0.0
        benchmark_server kvrocks
        cleanup_server

        {
          echo "# Cross-database benchmark context (${{ matrix.data_size }} byte payload)"
          echo
          echo "> Informational single-runner snapshot. Use the paired screening below for feature-vs-main regression decisions."
          echo
          echo "- Workload: \`N=200000\`, \`C=100\`, \`R=2147483647\`, \`seed=279000\`"
          echo "- Servers: Nimbis Feature, Nimbis Main, Redis $REDIS_VERSION, PikiwiDB $PIKIWIDB_VERSION, Kvrocks v$KVROCKS_VERSION"
          echo "- RPS: higher is better; P=1 p50: lower is better; P=50 p50 is intentionally omitted"
          echo
          "$context_xtask" compare-benchmarks \
            --main "$context_root/main-p1.txt" \
            --pr "$context_root/feature-p1.txt" \
            --baseline "Redis $REDIS_VERSION=$context_root/redis-p1.txt" \
            --baseline "PikiwiDB $PIKIWIDB_VERSION=$context_root/pikiwidb-p1.txt" \
            --baseline "Kvrocks v$KVROCKS_VERSION=$context_root/kvrocks-p1.txt" \
            --main-pipeline "$context_root/main-p50-report.txt" \
            --pr-pipeline "$context_root/feature-p50-report.txt" \
            --baseline-pipeline "Redis $REDIS_VERSION=$context_root/redis-p50-report.txt" \
            --baseline-pipeline "PikiwiDB $PIKIWIDB_VERSION=$context_root/pikiwidb-p50-report.txt" \
            --baseline-pipeline "Kvrocks v$KVROCKS_VERSION=$context_root/kvrocks-p50-report.txt" \
            --main-label "Nimbis Main" \
            --pr-label "Nimbis Feature" \
            --pipeline-depth 50
        } > "$context_root/benchmark_context_${{ matrix.data_size }}.md"

    - name: Add cross-database context to job summary
      run: cat benchmark-context/benchmark_context_${{ matrix.data_size }}.md >> "$GITHUB_STEP_SUMMARY"

    - name: Upload cross-database context
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-context-${{ matrix.data_size }}
        path: benchmark-context
        if-no-files-found: error
        retention-days: 30

  benchmark_aggregate:
    name: Aggregate Benchmark Results
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [build_release, benchmark, benchmark_context]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Download PR xtask
      uses: actions/download-artifact@v8
      with:
        name: nimbis-release-ubuntu-latest
        path: artifacts/pr

    - name: Make xtask executable
      run: chmod +x artifacts/pr/xtask

    - name: Download raw benchmark shards
      uses: actions/download-artifact@v8
      with:
        pattern: benchmark-shard-*
        path: benchmark-input
        merge-multiple: false

    - name: Download cross-database context
      uses: actions/download-artifact@v8
      with:
        pattern: benchmark-context-*
        path: benchmark-context
        merge-multiple: false

    - name: Generate aggregate benchmark report
      id: report
      continue-on-error: true
      run: |
        ./artifacts/pr/xtask benchmark-ci-report \
          --input-dir benchmark-input \
          --output paired_report.md \
          --expected-replicas 3
        {
          cat benchmark-context/benchmark-context-512/benchmark_context_512.md
          echo
          cat benchmark-context/benchmark-context-1024/benchmark_context_1024.md
          echo
          echo "---"
          echo
          cat paired_report.md
        } > benchmark_report.md

    - name: Add benchmark report to job summary
      if: ${{ always() }}
      run: |
        if [[ -f benchmark_report.md ]]; then
          cat benchmark_report.md >> "$GITHUB_STEP_SUMMARY"
        else
          {
            echo "## Benchmark report unavailable"
            echo
            echo "The benchmark aggregator did not produce a report."
          } >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload combined benchmark results
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-results-${{ github.run_id }}
        path: |
          benchmark-input
          benchmark-context
          paired_report.md
          benchmark_report.md
        if-no-files-found: error
        retention-days: 30
        overwrite: true

    - name: Fail incomplete benchmark aggregation
      if: >-
        ${{
          needs.benchmark.result != 'success' ||
          needs.benchmark_context.result != 'success' ||
          steps.report.outcome != 'success'
        }}
      run: exit 1

  benchmark_publish:
    name: Publish Benchmark Report
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        needs.benchmark_aggregate.result == 'success' &&
        github.actor != 'dependabot[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    needs: benchmark_aggregate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
    - name: Download aggregate benchmark report
      uses: actions/download-artifact@v8
      with:
        name: benchmark-results-${{ github.run_id }}
        path: benchmark-results

    - name: Update benchmark PR comment
      uses: actions/github-script@v9
      with:
        script: |
          const fs = require('fs');
          const marker = '<!-- nimbis-benchmark-report:v2 -->';
          const report = fs.readFileSync('benchmark-results/benchmark_report.md', 'utf8');
          const prNumber = context.payload.pull_request.number;
          const expectedHeadSha = context.payload.pull_request.head.sha;
          const expectedBaseSha = context.payload.pull_request.base.sha;
          const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
          const { data: pullRequest } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: prNumber,
          });
          if (
            pullRequest.head.sha !== expectedHeadSha ||
            pullRequest.base.sha !== expectedBaseSha
          ) {
            core.notice(
              `Skipping stale benchmark report for base/head ` +
                `${expectedBaseSha}/${expectedHeadSha}; the PR is now ` +
                `${pullRequest.base.sha}/${pullRequest.head.sha}.`,
            );
            return;
          }
          const body = [
            marker,
            `Workflow run: [${{ github.run_id }}](${runUrl})`,
            `Source PR base/head: \`${expectedBaseSha}\` / \`${expectedHeadSha}\``,
            '',
            report,
          ].join('\n');

          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
            per_page: 100,
          });
          const existingComment = comments.find(
            (comment) =>
              comment.user &&
              comment.user.login === 'github-actions[bot]' &&
              comment.body &&
              comment.body.includes(marker),
          );

          if (existingComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existingComment.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
          }
