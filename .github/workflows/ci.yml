name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  # Always enable colored output in Cargo (for better readability in CI logs)
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: llvm-tools-preview

    - name: Cache Rust Dependencies
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ runner.os }}-rust-check
        cache-on-failure: true

    - name: Install just
      uses: taiki-e/install-action@just

    - name: Check
      run: just check

    - name: Install cargo-shear
      uses: taiki-e/install-action@cargo-shear

    - name: Run cargo-shear
      run: cargo shear

  unit_test:
    name: Unit Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: llvm-tools-preview

    - name: Cache Rust Dependencies
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ runner.os }}-rust-unit-test
        cache-on-failure: true

    - name: Install just
      uses: taiki-e/install-action@just

    - name: Install nextest
      uses: taiki-e/install-action@nextest

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Run Unit Test
      run: just test

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./codecov.json
        flags: rust
        name: rust-coverage
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  build_release:
    name: Build Release
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: llvm-tools-preview

    - name: Cache Rust Dependencies
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ runner.os }}-rust-build-release-e2e
        cache-on-failure: true

    - name: Install just
      uses: taiki-e/install-action@just

    - name: Build Release
      run: just build --release

    - name: Upload Unix Release Binary
      if: runner.os != 'Windows'
      uses: actions/upload-artifact@v7
      with:
        name: nimbis-release-${{ matrix.os }}
        path: target/release/nimbis
        if-no-files-found: error

    - name: Upload Windows Release Binary
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v7
      with:
        name: nimbis-release-${{ matrix.os }}
        path: target/release/nimbis.exe
        if-no-files-found: error

  build_main_release:
    name: Build Main Release
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: llvm-tools-preview

    - name: Cache Rust Dependencies
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ubuntu-latest-rust-build-main-release
        cache-on-failure: true

    - name: Install just
      uses: taiki-e/install-action@just

    - name: Build Release
      run: just build --release

    - name: Upload Main Release Binary
      uses: actions/upload-artifact@v7
      with:
        name: nimbis-release-main-ubuntu-latest
        path: target/release/nimbis
        if-no-files-found: error

  e2e_local:
    name: E2E Test (Local Filesystem)
    needs: build_release
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - name: Install just
      uses: taiki-e/install-action@just

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'
        cache: true
        cache-dependency-path: e2e-test/go.sum

    - name: Download Release Binary
      uses: actions/download-artifact@v8
      with:
        name: nimbis-release-${{ matrix.os }}
        path: target/release

    - name: Make Release Binary Executable
      if: runner.os != 'Windows'
      run: chmod +x target/release/nimbis

    - name: Run E2E Test
      run: just e2e-test

  e2e_minio:
    name: E2E Test (MinIO)
    needs: build_release
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install just
      uses: taiki-e/install-action@just

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'
        cache: true
        cache-dependency-path: e2e-test/go.sum

    - name: Download Release Binary
      uses: actions/download-artifact@v8
      with:
        name: nimbis-release-ubuntu-latest
        path: target/release

    - name: Make Release Binary Executable
      run: chmod +x target/release/nimbis

    - name: Start MinIO
      run: |
        docker run -d \
          --name nimbis-minio \
          -p 9000:9000 \
          -e MINIO_ROOT_USER=minioadmin \
          -e MINIO_ROOT_PASSWORD=minioadmin \
          quay.io/minio/minio server /data --address :9000
        for i in {1..30}; do
          if curl -fsS http://127.0.0.1:9000/minio/health/ready; then
            exit 0
          fi
          sleep 1
        done
        docker logs nimbis-minio
        exit 1

    - name: Create MinIO bucket
      run: |
        docker run --rm --network host \
          -e MC_HOST_local=http://minioadmin:minioadmin@127.0.0.1:9000 \
          quay.io/minio/mc mb --ignore-existing local/nimbis

    - name: Run E2E Test Against MinIO
      env:
        NIMBIS_OBJECT_STORE_URL: s3://nimbis/nimbis-ci-${{ github.run_id }}
        NIMBIS_OBJECT_STORE_OPTION_AWS_REGION: us-east-1
        NIMBIS_OBJECT_STORE_OPTION_AWS_ENDPOINT: http://127.0.0.1:9000
        NIMBIS_OBJECT_STORE_OPTION_AWS_ACCESS_KEY_ID: minioadmin
        NIMBIS_OBJECT_STORE_OPTION_AWS_SECRET_ACCESS_KEY: minioadmin
        NIMBIS_OBJECT_STORE_OPTION_AWS_VIRTUAL_HOSTED_STYLE_REQUEST: "false"
        NIMBIS_OBJECT_STORE_OPTION_AWS_ALLOW_HTTP: "true"
      run: just e2e-test

  benchmark:
    name: Benchmark (${{ matrix.slot_title }}, ${{ matrix.data_size }} bytes)
    if: ${{ github.event_name == 'pull_request' }}
    needs: [build_release, build_main_release]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - slot_id: 1
            slot_title: First benchmark
            data_size: 512
          - slot_id: 2
            slot_title: Second benchmark
            data_size: 512
          - slot_id: 3
            slot_title: Third benchmark
            data_size: 512
          - slot_id: 1
            slot_title: First benchmark
            data_size: 1024
          - slot_id: 2
            slot_title: Second benchmark
            data_size: 1024
          - slot_id: 3
            slot_title: Third benchmark
            data_size: 1024

    steps:
    - name: Install dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y redis-tools redis-server

        tools_dir="$RUNNER_TEMP/redis-tools"
        mkdir -p "$tools_dir"
        tools_container=$(docker create redis:7.2.0-bookworm)
        trap 'docker rm -f "$tools_container" >/dev/null 2>&1 || true' EXIT
        docker cp "$tools_container:/usr/local/bin/redis-benchmark" \
          "$tools_dir/redis-benchmark"
        chmod +x "$tools_dir/redis-benchmark"
        echo "$tools_dir" >> "$GITHUB_PATH"

        "$tools_dir/redis-benchmark" --help 2>&1 | grep -q -- '--seed'
        "$tools_dir/redis-benchmark" --version

    - uses: actions/checkout@v7

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@nightly

    - name: Cache Rust Dependencies
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: benchmark-xtask
        cache-on-failure: true

    - name: Download main benchmark binary
      uses: actions/download-artifact@v8
      with:
        name: nimbis-release-main-ubuntu-latest
        path: artifacts/main/target/release

    - name: Download PR ubuntu release artifact
      uses: actions/download-artifact@v8
      with:
        name: nimbis-release-ubuntu-latest
        path: artifacts/pr/target/release

    - name: Make release binaries executable
      run: |
        chmod +x artifacts/main/target/release/nimbis
        chmod +x artifacts/pr/target/release/nimbis

    - name: Record benchmark runner metadata
      run: |
        {
          echo "runner.name=${RUNNER_NAME:-unknown}"
          echo "runner.os=${RUNNER_OS:-unknown}"
          echo "runner.arch=${RUNNER_ARCH:-unknown}"
          echo "image.os=${ImageOS:-unknown}"
          echo "image.version=${ImageVersion:-unknown}"
          echo "github.run_id=${GITHUB_RUN_ID}"
          echo "github.run_attempt=${GITHUB_RUN_ATTEMPT}"
          echo "github.base_sha=${{ github.event.pull_request.base.sha }}"
          echo "github.head_sha=${{ github.event.pull_request.head.sha }}"
          echo "github.merge_sha=${GITHUB_SHA}"
          echo "matrix.slot_id=${{ matrix.slot_id }}"
          echo "matrix.data_size=${{ matrix.data_size }}"
          echo
          uname -a
          echo
          lscpu
          echo
          rustc --version --verbose
          cargo --version --verbose
          redis-benchmark --version
          redis-server --version
        } | tee benchmark_runner_info.txt

    - name: Build benchmark harness
      run: cargo build --package xtask

    - name: Run paired Nimbis benchmarks
      shell: bash
      run: |
        set -euo pipefail

        sudo systemctl stop redis-server || true
        NIMBIS_PID=""

        stop_nimbis() {
          if [[ -z "${NIMBIS_PID:-}" ]]; then
            return
          fi

          kill "$NIMBIS_PID" >/dev/null 2>&1 || true
          for _ in $(seq 1 50); do
            if ! kill -0 "$NIMBIS_PID" >/dev/null 2>&1; then
              break
            fi
            sleep 0.1
          done
          if kill -0 "$NIMBIS_PID" >/dev/null 2>&1; then
            kill -KILL "$NIMBIS_PID" >/dev/null 2>&1 || true
          fi
          wait "$NIMBIS_PID" >/dev/null 2>&1 || true
          NIMBIS_PID=""
        }

        wait_for_nimbis() {
          local log_file=$1

          for _ in $(seq 1 30); do
            if ! kill -0 "$NIMBIS_PID" >/dev/null 2>&1; then
              echo "Nimbis exited before becoming ready"
              cat "$log_file"
              return 1
            fi
            if timeout 1s redis-cli -h 127.0.0.1 -p 6379 PING 2>/dev/null \
              | grep -qx PONG; then
              return
            fi
            sleep 1
          done

          echo "Timed out waiting for Nimbis readiness"
          cat "$log_file"
          return 1
        }

        run_measurement() {
          local variant=$1
          local round=$2
          local pipeline=$3
          local binary output_file output_dir store_dir log_file seed

          binary="./artifacts/${variant}/target/release/nimbis"
          seed=$((1000000 + ${{ matrix.data_size }} * 10 + ${{ matrix.slot_id }} * 100 + round))

          if [[ "$pipeline" == "1" ]]; then
            output_file="benchmark_${variant}_round_${round}.txt"
            output_dir="benchmark_${variant}_round_${round}_suites"
          else
            output_file="benchmark_${variant}_pipeline_round_${round}.txt"
            output_dir="benchmark_${variant}_pipeline_round_${round}_suites"
          fi

          store_dir="nimbis_benchmark_store/${{ matrix.data_size }}/slot-${{ matrix.slot_id }}/round-${round}/${variant}/pipeline-${pipeline}"
          log_file="nimbis_${variant}_round_${round}_pipeline_${pipeline}.log"
          if [[ -e "$store_dir" ]]; then
            echo "Refusing to reuse benchmark store: $store_dir"
            return 1
          fi
          mkdir -p "$(dirname "$store_dir")"

          if timeout 2s redis-cli -h 127.0.0.1 -p 6379 PING >/dev/null 2>&1; then
            echo "Port 6379 is already serving Redis traffic"
            ss -ltnp | grep ':6379' || true
            return 1
          fi

          echo "Running ${variant} round ${round} (pipeline=${pipeline}, seed=${seed})"
          NIMBIS_OBJECT_STORE_URL="file:${store_dir}" \
            "$binary" > "$log_file" 2>&1 &
          NIMBIS_PID=$!
          wait_for_nimbis "$log_file"

          N=200000 C=100 R=100000 D=${{ matrix.data_size }} P="$pipeline" \
            OUTPUT_DIR="$output_dir" \
            timeout --signal=TERM --kill-after=30s 15m \
            ./target/debug/xtask redis-benchmark \
              --profile comparison \
              --seed "$seed" \
              --settle-ms 20000 \
            > "$output_file"

          stop_nimbis
        }

        run_pair() {
          local round=$1
          local pipeline=$2
          local first=$3
          local second=$4

          run_measurement "$first" "$round" "$pipeline"
          run_measurement "$second" "$round" "$pipeline"
        }

        trap stop_nimbis EXIT

        if (( ${{ matrix.slot_id }} % 2 == 1 )); then
          first_round_order=(main pr)
          second_round_order=(pr main)
        else
          first_round_order=(pr main)
          second_round_order=(main pr)
        fi

        {
          echo "paired.round_1_order=${first_round_order[*]}"
          echo "paired.round_2_order=${second_round_order[*]}"
          echo "paired.settle_ms=20000"
        } >> benchmark_runner_info.txt

        for pipeline in 1 50; do
          run_pair 1 "$pipeline" "${first_round_order[@]}"
          run_pair 2 "$pipeline" "${second_round_order[@]}"
        done

    - name: Resolve latest baseline versions
      continue-on-error: true
      run: |
        PIKIWIDB_VERSION=$(curl -fsSL \
          "https://hub.docker.com/v2/repositories/pikadb/pika/tags?page_size=10&ordering=last_updated" \
          | python3 -c 'import json, sys; print(next(tag["name"] for tag in json.load(sys.stdin)["results"] if tag["name"] != "latest"))')
        KVROCKS_RELEASE=$(curl -fsSL \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ github.token }}" \
          https://api.github.com/repos/apache/kvrocks/releases/latest | python3 -c "import json, sys; print(json.load(sys.stdin)['tag_name'])")
        KVROCKS_VERSION=${KVROCKS_RELEASE#v}

        echo "PIKIWIDB_VERSION=$PIKIWIDB_VERSION" >> "$GITHUB_ENV"
        echo "KVROCKS_RELEASE=$KVROCKS_RELEASE" >> "$GITHUB_ENV"
        echo "KVROCKS_VERSION=$KVROCKS_VERSION" >> "$GITHUB_ENV"
        {
          echo "baseline.pikiwidb_version=$PIKIWIDB_VERSION"
          echo "baseline.kvrocks_release=$KVROCKS_RELEASE"
        } >> benchmark_runner_info.txt

    - name: Run Redis Benchmark
      continue-on-error: true
      run: |
        sudo systemctl start redis-server
        sleep 5

        echo "Warmup on Redis..."
        redis-benchmark -q -t set,get -n 1000 -c 10 > /dev/null 2>&1 || true

        redis-cli FLUSHDB || true
        redis-cli HSET bench:hash field1 value1 || true
        redis-benchmark -q -n 200000 -c 100 -r 100000 SADD bench:set:srem member:__rand_int__ > /dev/null || true
        redis-benchmark -q -n 200000 -c 100 -r 100000 ZADD bench:zset:zrem __rand_int__ member:__rand_int__ > /dev/null || true

        echo "Running Benchmark on Redis..."
        redis-benchmark -q -t set,get,hset,lpush,lpop,sadd,zadd -n 200000 -c 100 -r 100000 -d ${{ matrix.data_size }} > benchmark_redis.txt || true
        redis-benchmark -q -n 200000 -c 100 -r 100000 -d ${{ matrix.data_size }} HGET bench:hash field1 >> benchmark_redis.txt || true
        redis-benchmark -q -n 200000 -c 100 -r 100000 -d ${{ matrix.data_size }} SREM bench:set:srem member:__rand_int__ >> benchmark_redis.txt || true
        redis-benchmark -q -n 200000 -c 100 -r 100000 -d ${{ matrix.data_size }} ZREM bench:zset:zrem member:__rand_int__ >> benchmark_redis.txt || true

        sudo systemctl stop redis-server

    - name: Run Redis Benchmark with Pipeline
      continue-on-error: true
      run: |
        sudo systemctl start redis-server
        sleep 5

        echo "Warmup on Redis (Pipeline)..."
        redis-benchmark -q -t set,get -n 1000 -c 10 -P 50 > /dev/null 2>&1 || true

        redis-cli FLUSHDB || true
        redis-cli HSET bench:hash field1 value1 || true
        redis-benchmark -q -n 200000 -c 100 -r 100000 SADD bench:set:srem member:__rand_int__ > /dev/null || true
        redis-benchmark -q -n 200000 -c 100 -r 100000 ZADD bench:zset:zrem __rand_int__ member:__rand_int__ > /dev/null || true

        echo "Running Benchmark on Redis (Pipeline)..."
        redis-benchmark -q -t set,get,hset,lpush,lpop,sadd,zadd -n 200000 -c 100 -r 100000 -d ${{ matrix.data_size }} -P 50 > benchmark_redis_pipeline.txt || true
        redis-benchmark -q -n 200000 -c 100 -r 100000 -d ${{ matrix.data_size }} -P 50 HGET bench:hash field1 >> benchmark_redis_pipeline.txt || true
        redis-benchmark -q -n 200000 -c 100 -r 100000 -d ${{ matrix.data_size }} -P 50 SREM bench:set:srem member:__rand_int__ >> benchmark_redis_pipeline.txt || true
        redis-benchmark -q -n 200000 -c 100 -r 100000 -d ${{ matrix.data_size }} -P 50 ZREM bench:zset:zrem member:__rand_int__ >> benchmark_redis_pipeline.txt || true

        sudo systemctl stop redis-server

    - name: Run PikiwiDB Benchmark
      continue-on-error: true
      run: |
        trap 'docker rm -f pikiwidb-benchmark >/dev/null 2>&1 || true' EXIT
        docker run -d --rm --name pikiwidb-benchmark -p 6379:9221 pikadb/pika:${PIKIWIDB_VERSION}
        sleep 10

        echo "Warmup on PikiwiDB ${PIKIWIDB_VERSION}..."
        redis-benchmark -q -t set,get -n 1000 -c 10 > /dev/null 2>&1 || true

        redis-cli FLUSHDB || true
        redis-cli HSET bench:hash field1 value1 || true
        redis-benchmark -q -n 200000 -c 100 -r 100000 SADD bench:set:srem member:__rand_int__ > /dev/null || true
        redis-benchmark -q -n 200000 -c 100 -r 100000 ZADD bench:zset:zrem __rand_int__ member:__rand_int__ > /dev/null || true

        echo "Running Benchmark on PikiwiDB ${PIKIWIDB_VERSION}..."
        redis-benchmark -q -t set,get,hset,lpush,lpop,sadd,zadd -n 200000 -c 100 -r 100000 -d ${{ matrix.data_size }} > benchmark_pikiwidb.txt || true
        redis-benchmark -q -n 200000 -c 100 -r 100000 -d ${{ matrix.data_size }} HGET bench:hash field1 >> benchmark_pikiwidb.txt || true
        redis-benchmark -q -n 200000 -c 100 -r 100000 -d ${{ matrix.data_size }} SREM bench:set:srem member:__rand_int__ >> benchmark_pikiwidb.txt || true
        redis-benchmark -q -n 200000 -c 100 -r 100000 -d ${{ matrix.data_size }} ZREM bench:zset:zrem member:__rand_int__ >> benchmark_pikiwidb.txt || true

    - name: Run PikiwiDB Benchmark with Pipeline
      continue-on-error: true
      run: |
        trap 'docker rm -f pikiwidb-benchmark >/dev/null 2>&1 || true' EXIT
        docker run -d --rm --name pikiwidb-benchmark -p 6379:9221 pikadb/pika:${PIKIWIDB_VERSION}
        sleep 10

        echo "Warmup on PikiwiDB ${PIKIWIDB_VERSION} (Pipeline)..."
        redis-benchmark -q -t set,get -n 1000 -c 10 -P 50 > /dev/null 2>&1 || true

        redis-cli FLUSHDB || true
        redis-cli HSET bench:hash field1 value1 || true
        redis-benchmark -q -n 200000 -c 100 -r 100000 SADD bench:set:srem member:__rand_int__ > /dev/null || true
        redis-benchmark -q -n 200000 -c 100 -r 100000 ZADD bench:zset:zrem __rand_int__ member:__rand_int__ > /dev/null || true

        echo "Running Benchmark on PikiwiDB ${PIKIWIDB_VERSION} (Pipeline)..."
        redis-benchmark -q -t set,get,hset,lpush,lpop,sadd,zadd -n 200000 -c 100 -r 100000 -d ${{ matrix.data_size }} -P 50 > benchmark_pikiwidb_pipeline.txt || true
        redis-benchmark -q -n 200000 -c 100 -r 100000 -d ${{ matrix.data_size }} -P 50 HGET bench:hash field1 >> benchmark_pikiwidb_pipeline.txt || true
        redis-benchmark -q -n 200000 -c 100 -r 100000 -d ${{ matrix.data_size }} -P 50 SREM bench:set:srem member:__rand_int__ >> benchmark_pikiwidb_pipeline.txt || true
        redis-benchmark -q -n 200000 -c 100 -r 100000 -d ${{ matrix.data_size }} -P 50 ZREM bench:zset:zrem member:__rand_int__ >> benchmark_pikiwidb_pipeline.txt || true

    - name: Run Kvrocks Benchmark
      continue-on-error: true
      run: |
        trap 'docker rm -f kvrocks-benchmark >/dev/null 2>&1 || true' EXIT
        docker run -d --rm --name kvrocks-benchmark -p 6379:6666 apache/kvrocks:${KVROCKS_VERSION} --bind 0.0.0.0
        sleep 10

        echo "Warmup on Kvrocks ${KVROCKS_RELEASE}..."
        redis-benchmark -q -t set,get -n 1000 -c 10 > /dev/null 2>&1 || true

        redis-cli FLUSHDB || true
        redis-cli HSET bench:hash field1 value1 || true
        redis-benchmark -q -n 200000 -c 100 -r 100000 SADD bench:set:srem member:__rand_int__ > /dev/null || true
        redis-benchmark -q -n 200000 -c 100 -r 100000 ZADD bench:zset:zrem __rand_int__ member:__rand_int__ > /dev/null || true

        echo "Running Benchmark on Kvrocks ${KVROCKS_RELEASE}..."
        redis-benchmark -q -t set,get,hset,lpush,lpop,sadd,zadd -n 200000 -c 100 -r 100000 -d ${{ matrix.data_size }} > benchmark_kvrocks.txt || true
        redis-benchmark -q -n 200000 -c 100 -r 100000 -d ${{ matrix.data_size }} HGET bench:hash field1 >> benchmark_kvrocks.txt || true
        redis-benchmark -q -n 200000 -c 100 -r 100000 -d ${{ matrix.data_size }} SREM bench:set:srem member:__rand_int__ >> benchmark_kvrocks.txt || true
        redis-benchmark -q -n 200000 -c 100 -r 100000 -d ${{ matrix.data_size }} ZREM bench:zset:zrem member:__rand_int__ >> benchmark_kvrocks.txt || true

    - name: Run Kvrocks Benchmark with Pipeline
      continue-on-error: true
      run: |
        trap 'docker rm -f kvrocks-benchmark >/dev/null 2>&1 || true' EXIT
        docker run -d --rm --name kvrocks-benchmark -p 6379:6666 apache/kvrocks:${KVROCKS_VERSION} --bind 0.0.0.0
        sleep 10

        echo "Warmup on Kvrocks ${KVROCKS_RELEASE} (Pipeline)..."
        redis-benchmark -q -t set,get -n 1000 -c 10 -P 50 > /dev/null 2>&1 || true

        redis-cli FLUSHDB || true
        redis-cli HSET bench:hash field1 value1 || true
        redis-benchmark -q -n 200000 -c 100 -r 100000 SADD bench:set:srem member:__rand_int__ > /dev/null || true
        redis-benchmark -q -n 200000 -c 100 -r 100000 ZADD bench:zset:zrem __rand_int__ member:__rand_int__ > /dev/null || true

        echo "Running Benchmark on Kvrocks ${KVROCKS_RELEASE} (Pipeline)..."
        redis-benchmark -q -t set,get,hset,lpush,lpop,sadd,zadd -n 200000 -c 100 -r 100000 -d ${{ matrix.data_size }} -P 50 > benchmark_kvrocks_pipeline.txt || true
        redis-benchmark -q -n 200000 -c 100 -r 100000 -d ${{ matrix.data_size }} -P 50 HGET bench:hash field1 >> benchmark_kvrocks_pipeline.txt || true
        redis-benchmark -q -n 200000 -c 100 -r 100000 -d ${{ matrix.data_size }} -P 50 SREM bench:set:srem member:__rand_int__ >> benchmark_kvrocks_pipeline.txt || true
        redis-benchmark -q -n 200000 -c 100 -r 100000 -d ${{ matrix.data_size }} -P 50 ZREM bench:zset:zrem member:__rand_int__ >> benchmark_kvrocks_pipeline.txt || true

    - name: Upload raw benchmark evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-raw-${{ matrix.slot_id }}-${{ matrix.data_size }}
        path: |
          benchmark_*.txt
          benchmark_*_suites/
          benchmark_runner_info.txt
          nimbis_*.log
        if-no-files-found: warn
        overwrite: true
        retention-days: 14

  benchmark_report:
    name: Aggregate benchmark report
    if: ${{ github.event_name == 'pull_request' && needs.benchmark.result == 'success' }}
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@nightly

    - name: Download benchmark evidence
      uses: actions/download-artifact@v8
      with:
        pattern: benchmark-raw-*
        path: benchmark-artifacts
        merge-multiple: false

    - name: Build benchmark report harness
      run: cargo build --package xtask

    - name: Aggregate paired benchmark reports
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p benchmark-reports

        add_baseline_if_present() {
          local option=$1
          local name=$2
          local file=$3

          if grep -q 'requests per second' "$file" 2>/dev/null; then
            compare_args+=("$option" "${name}=${file}")
          else
            echo "Skipping unavailable informational baseline: $name ($file)"
          fi
        }

        for data_size in 512 1024; do
          compare_args=()

          for slot in 1 2 3; do
            slot_dir="benchmark-artifacts/benchmark-raw-${slot}-${data_size}"
            test -d "$slot_dir"

            for round in 1 2; do
              compare_args+=(
                --main "$slot_dir/benchmark_main_round_${round}.txt"
                --pr "$slot_dir/benchmark_pr_round_${round}.txt"
                --main-pipeline "$slot_dir/benchmark_main_pipeline_round_${round}.txt"
                --pr-pipeline "$slot_dir/benchmark_pr_pipeline_round_${round}.txt"
              )
            done

            add_baseline_if_present \
              --baseline Redis "$slot_dir/benchmark_redis.txt"
            add_baseline_if_present \
              --baseline PikiwiDB "$slot_dir/benchmark_pikiwidb.txt"
            add_baseline_if_present \
              --baseline Kvrocks "$slot_dir/benchmark_kvrocks.txt"
            add_baseline_if_present \
              --baseline-pipeline Redis "$slot_dir/benchmark_redis_pipeline.txt"
            add_baseline_if_present \
              --baseline-pipeline PikiwiDB "$slot_dir/benchmark_pikiwidb_pipeline.txt"
            add_baseline_if_present \
              --baseline-pipeline Kvrocks "$slot_dir/benchmark_kvrocks_pipeline.txt"
          done

          report_file="benchmark-reports/benchmark_report_${data_size}.md"
          ./target/debug/xtask compare-benchmarks "${compare_args[@]}" > "$report_file"

          {
            echo
            echo "<details><summary>Benchmark runner metadata</summary>"
            echo
            for slot in 1 2 3; do
              echo "#### Slot ${slot}"
              echo
              echo '```text'
              cat "benchmark-artifacts/benchmark-raw-${slot}-${data_size}/benchmark_runner_info.txt"
              echo '```'
              echo
            done
            echo "</details>"
          } >> "$report_file"

          cat "$report_file"
        done

    - name: Comment aggregated reports on PR
      uses: actions/github-script@v9
      with:
        script: |
          const fs = require('fs');
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const prNumber = context.payload.pull_request.number;
          const expectedHeadSha = '${{ github.event.pull_request.head.sha }}';
          const { data: pullRequest } = await github.rest.pulls.get({
            owner,
            repo,
            pull_number: prNumber,
          });
          if (pullRequest.head.sha !== expectedHeadSha) {
            core.warning(
              `Skipping stale benchmark report for ${expectedHeadSha}; ` +
                `current PR head is ${pullRequest.head.sha}`,
            );
            return;
          }

          const comments = await github.paginate(github.rest.issues.listComments, {
            owner,
            repo,
            issue_number: prNumber,
            per_page: 100,
          });

          for (const dataSize of [512, 1024]) {
            const marker = `<!-- benchmark-report-aggregate:${dataSize} -->`;
            const report = fs.readFileSync(
              `benchmark-reports/benchmark_report_${dataSize}.md`,
              'utf8',
            );
            const body = [
              marker,
              `## Aggregated benchmark (${dataSize} bytes)`,
              '',
              '6 paired samples across 3 hosted runners',
              '',
              `Workflow run: ${context.runId}`,
              '',
              report,
            ].join('\n');
            const existingComment = comments.find(
              (item) => item.body && item.body.includes(marker),
            );
            let reportComment;

            if (existingComment) {
              const response = await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body,
              });
              reportComment = response.data;
            } else {
              const response = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
              reportComment = response.data;
            }

            const legacyPattern = new RegExp(
              `<!-- benchmark-report-slot:(\\d+):${dataSize} -->`,
            );
            const legacyComments = comments.filter(
              (item) => item.body && legacyPattern.test(item.body),
            );
            for (const legacyComment of legacyComments) {
              const slotId = legacyComment.body.match(legacyPattern)[1];
              try {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: legacyComment.id,
                  body: [
                    `<!-- benchmark-report-slot-superseded:${slotId}:${dataSize} -->`,
                    `[This per-slot report is superseded by the aggregated report.](${reportComment.html_url})`,
                  ].join('\n'),
                });
              } catch (error) {
                core.warning(
                  `Could not mark legacy benchmark comment ${legacyComment.id} as superseded: ${error}`,
                );
              }
            }
          }

    - name: Upload aggregated benchmark reports
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-reports
        path: benchmark-reports/
        overwrite: true
        retention-days: 14
